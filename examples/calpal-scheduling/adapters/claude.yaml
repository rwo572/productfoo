schema_version: "0.1"
agent:
  provider: claude
  name: Claude Code
  adapter_version: "0.1"

capabilities:
  session_start: true
  user_prompt: true
  assistant_message: true
  tool_call: true
  tool_result: true
  session_end: true
  transcript_path: true
  raw_transcript_import: true
  mcp_tool_names: partial

correlation:
  session_id: native
  turn_id: derived
  trace_id: generated
  workspace_root: native

privacy:
  redacts_by_default: true
  stores_raw_payloads: false
  raw_payload_ref_supported: true

known_gaps: []

extensions: {}
