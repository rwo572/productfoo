name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: node --test .github/scripts/verify-release.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run verify:public
      - run: node bin/foo self check
      - run: node bin/foo commands validate
      - run: git diff --exit-code
  installed-runtime:
    name: Installed CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.0.0', '18.x', '20.x', '22.x', '24.x', '26.5.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Compilation uses the contributor toolchain, independent of the installed CLI runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version && npm --version
      - name: Install the built package with the runtime's npm
        run: npm install --prefix "$RUNNER_TEMP/productfoo-runtime" ./productfoo-*.tgz --ignore-scripts --no-audit --no-fund
      - name: Exercise the installed CLI with networking denied
        run: node scripts/test-installed-runtime.mjs "$RUNNER_TEMP/productfoo-runtime/node_modules/productfoo"
