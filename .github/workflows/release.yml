name: Release
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full approved commit SHA; select the protected v1.0.0 tag above'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'rwo572/productfoo' && github.ref_type == 'tag' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: node .github/scripts/verify-release.mjs release
      - run: node --test .github/scripts/verify-release.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build:public
      - run: npm pack --ignore-scripts
      - run: node .github/scripts/verify-release.mjs package
      - name: Publish the verified tarball with OIDC and provenance
        run: npm publish ./productfoo-1.0.0.tgz --ignore-scripts --access public --provenance
